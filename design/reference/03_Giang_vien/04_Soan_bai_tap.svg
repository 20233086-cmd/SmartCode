on Sans, Arial, sans-serif" font-size="28" fill="#172333" font-weight="700">Tạo bài tập</text><text xml:space="preserve" x="272" y="157" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">Bản nháp • Chỉ hiển thị với học viên sau khi xuất bản.</text><rect x="272" y="193" width="745" height="720" rx="12" fill="white" stroke="#E2E8F0"/><text xml:space="preserve" x="297" y="233" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#778697" font-weight="700">Tên bài tập</text><rect x="297" y="245" width="694" height="48" rx="8" fill="white" stroke="#E2E8F0"/><text xml:space="preserve" x="313" y="275" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#172333" font-weight="400">Tính tổng từ 1 đến n</text><text xml:space="preserve" x="297" y="335" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#778697" font-weight="700">Kỹ năng / độ khó</text><rect x="297" y="347" width="694" height="48" rx="8" fill="white" stroke="#E2E8F0"/><text xml:space="preserve" x="313" y="377" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#172333" font-weight="400">Vòng lặp / Dễ</text><text xml:space="preserve" x="297" y="446" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#778697" font-weight="700">Mô tả đề bài</text><rect x="297" y="460" width="694" height="195" rx="9" fill="#F1F5F9"/><text xml:space="preserve" x="313" y="493" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#172333" font-weight="400">Nhập một số nguyên dương n. In tổng từ 1 đến n.</text><text xml:space="preserve" x="313" y="530" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#172333" font-weight="400">Ràng buộc: 1 ≤ n ≤ 1000.</text><text xml:space="preserve" x="313" y="567" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#172333" font-weight="400">Ví dụ: n = 5 → kết quả = 15.</text><text xml:space="preserve" x="297" y="702" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#778697" font-weight="700">Giới hạn thời gian / bộ nhớ</text><rect x="297" y="714" width="694" height="48" rx="8" fill="white" stroke="#E2E8F0"/><text xml:space="preserve" x="313" y="744" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#172333" font-weight="400">2 giây / 128 MB</text><rect x="297" y="832" width="194" height="40" rx="7" fill="#EFF4FA" stroke="#E2E8F0"/><text xml:space="preserve" x="313" y="857" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#3467B5" font-weight="700">Lưu bản nháp</text><rect x="785" y="832" width="205" height="40" rx="7" fill="url(#action)"/><text xml:space="preserve" x="801" y="857" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="white" font-weight="700">Xuất bản</text><rect x="1039" y="193" width="361" height="421" rx="12" fill="white" stroke="#E2E8F0"/><text xml:space="preserve" x="1061" y="225" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#172333" font-weight="700">Bộ kiểm thử</text><rect x="1054" y="254" width="330" height="230" rx="12" fill="white" stroke="#E2E8F0"/><rect x="1055" y="255" width="328" height="48" rx="12" fill="#F0F3FA"/><text xml:space="preserve" x="1072" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#778697" font-weight="700">Input</text><text xml:space="preserve" x="1162" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#778697" font-weight="700">Output</text><text xml:space="preserve" x="1307" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#778697" font-weight="700"></text><text xml:space="preserve" x="1072" y="335" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#172333" font-weight="400">1</text><text xml:space="preserve" x="1162" y="335" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#172333" font-weight