 font-size="18" fill="#593F9D" font-weight="400">n = int(input())</text><text xml:space="preserve" x="315" y="341" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#593F9D" font-weight="400">total = 0</text><text xml:space="preserve" x="315" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#593F9D" font-weight="400">for i in range(1, n):</text><text xml:space="preserve" x="315" y="431" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#593F9D" font-weight="400">    total += i</text><text xml:space="preserve" x="315" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#593F9D" font-weight="400">print(total)</text><text xml:space="preserve" x="298" y="637" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">Phiên bản đã nộp được giữ nguyên để xem lại.</text><rect x="298" y="685" width="320" height="40" rx="7" fill="url(#action)"/><text xml:space="preserve" x="314" y="710" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="white" font-weight="700">Mở lại trong trình soạn thảo</text><rect x="959" y="193" width="441" height="557" rx="12" fill="white" stroke="#E2E8F0"/><text xml:space="preserve" x="981" y="225" font-family="Liberation Sans, Arial, sans-serif" font-size="16" fill="#172333" font-weight="700">WA · Sai kết quả</text><text xml:space="preserve" x="983" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="24" fill="#2563EB" font-weight="700">3 / 5 bộ kiểm thử đạt</text><rect x="980" y="322" width="398" height="346" rx="12" fill="white" stroke="#E2E8F0"/><rect x="981" y="323" width="396" height="48" rx="12" fill="#F0F3FA"/><text xml:space="preserve" x="998" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#778697" font-weight="700">Test</text><text xml:space="preserve" x="1133" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#778697"