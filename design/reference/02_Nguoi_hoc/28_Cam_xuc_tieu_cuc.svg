7" font-weight="400">Bình thường</text><rect x="1298" y="652" width="97" height="34" rx="6" fill="#F2F5FA" stroke="#E2E8F0"/><text xml:space="preserve" x="1305" y="674" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#778697" font-weight="400">Tiêu cực</text><rect x="1090" y="715" width="307" height="40" rx="7" fill="url(#action)"/><text xml:space="preserve" x="1106" y="740" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="white" font-weight="700">Nghỉ ngắn 2 phút</text><rect x="1090" y="770" width="307" height="40" rx="7" fill="#EFF4FA" stroke="#E2E8F0"/><text xml:space="preserve" x="1106" y="795" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#3467B5" font-weight="700">Tạm dừng phân tích</text><text xml:space="preserve" x="1090" y="841" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#778697" font-weight="400">Chỉ là gợi ý; bạn có thể xác nhận lại.</text><text xml:space="preserve" x="1090" y="868" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#778697" font-weight="400">Không dùng để chấm điểm năng lực.</text></svg>