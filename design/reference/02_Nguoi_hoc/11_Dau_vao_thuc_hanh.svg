10" fill="#ECF3FF"/><rect x="43" y="183" width="4" height="131" rx="2" fill="#3B82F6"/><text xml:space="preserve" x="61" y="212" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#3B82F6" font-weight="700">Yêu cầu</text><text xml:space="preserve" x="61" y="242" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">Nhập chiều dài và chiều rộng</text><text xml:space="preserve" x="61" y="265" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">của hình chữ nhật (số thực),</text><text xml:space="preserve" x="61" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">tính và in ra diện tích.</text><rect x="43" y="333" width="290" height="110" rx="10" fill="#ECF3FF"/><rect x="43" y="333" width="4" height="110" rx="2" fill="#3B82F6"/><text xml:space="preserve" x="61" y="362" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#3B82F6" font-weight="700">IN  Đầu vào</text><text xml:space="preserve" x="61" y="392" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">Hai số thực length và width.</text><rect x="43" y="462" width="290" height="124" rx="10" fill="#EBFAEF"/><rect x="43" y="462" width="4" height="124" rx="2" fill="#22C55E"/><text xml:space="preserve" x="61" y="491" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#22C55E" font-weight="700">OUT  Đầu ra</text><text xml:space="preserve" x="61" y="521" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">Diện tích hình chữ nhật,</text><text xml:space="preserve" x="61" y="544" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">làm tròn đến 2 chữ số thập phân.</text><rect x="43" y="605" width="290" height="151" rx="10" fill="#F7EFFB"/><rect x="43" y="605" width="4" height="151" rx="2" fill="#A855F7"/><text xml:space="preserve" x="61" y="634" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#A855F7" font-weight="700">Giải thích</text><text xml:space="preserve" x="61" y="664" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">Diện tích = 5.5 × 3.2 = 17.60.</text><text xml:space="preserve" x="61" y="687" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">Có thể dùng printf để định dạng</text><text xml:space="preserve" x="61" y="710" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">kết quả với 2 chữ số thập phân.</text><text xml:space="preserve" x="43" y="803" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#172333" font-weight="700">Ví dụ</text><rect x="43" y="822" width="290" height="88" rx="8" fill="#F7F9FC"/><text xml:space="preserve" x="60" y="851" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">Input:  5.5 3.2</text><text xml:space="preserve" x="60" y="880" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#16A575" font-weight="400">Output: 17.60</text><rect x="374" y="88" width="675" height="105" rx="12" fill="white" stroke="#E2E8F0"/><text xml:space="preserve" x="394" y="127" font-family="Liberation Sans, Arial, sans-serif" font-size="27" fill="#172333" font-weight="700">Tính diện tích hình chữ nhật</text><rect x="396" y="149" width="60" height="23" rx="12" fill="#E2F8ED"/><text xml:space="preserve" x="406" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#1BA677" font-weight="700">DỄ</text><text xml:space="preserve" x="479" y="165" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#778697" font-weight="400">15 XP   •   Giới hạn 1 giây</text><rect x="374" y="211" width="675" height="479" rx="12" fill="white" stroke="#E2E8F0"/><rect x="375" y="212" width="673" height="54" rx="11" fill="#FFFFFF"/><rect x="393" y="219" width="108" height="40" rx="7" fill="#EFF4FA" stroke="#E2E8F0"/><text xml:space="preserve" x="409" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#3467B5" font-weight="700">Java  ▾</text><text xml:space="preserve" x="525" y="245" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#735AC7" font-weight="400">☾</text><rect x="568" y="219" width="126" height="40" rx="7" fill="#EFF4FA" stroke="#E2E8F0"/><text xml:space="preserve" x="584" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#3467B5" font-weight="700">Kiểm tra</text><text xml:space="preserve" x="941" y="245" font-family="Liberation Sans, Arial, sans-serif" font-size="10" fill="#778697" font-weight="700">CODE EDITOR</text><path d="M375 267 L1048 267" stroke="#E2E8F0" stroke-width="2"/><text xml:space="preserve" x="393" y="299" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#7793A7" font-weight="400">1</text><text xml:space="preserve" x="425" y="299" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#4B39A0" font-weight="400">import java.util.Scanner;</text><text xml:space="preserve" x="393" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#7793A7" font-weight="400">2</text><text xml:space="preserve" x="425" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#294E62" font-weight="400"></text><text xml:space="preserve" x="393" y="357" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#7793A7" font-weight="400">3</text><text xml:space="preserve" x="425" y="357" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#4B39A0" font-weight="400">public class Main {</text><text xml:space="preserve" x="393" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#7793A7" font-weight="400">4</text><text xml:space="preserve" x="425" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#4B39A0" font-weight="400">    public static void main(String[] args) {</text><text xml:space="preserve" x="393" y="415" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#7793A7" font-weight="400">5</text><text xml:space="preserve" x="425" y="415" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#294E62" font-weight="400">        Scanner sc = new Scanner(System.in);</text><text xml:space="preserve" x="393" y="444" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#7793A7" font-weight="400">6</text><text xml:space="preserve" x="425" y="444" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#294E62" font-weight="400">        double length = sc.nextDouble();</text><text xml:space="preserve" x="393" y="473" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#7793A7" font-weight="400">7</text><text xml:space="preserve" x="425" y="473" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#294E62" font-weight="400">        double width = sc.nextDouble();</text><text xml:space="preserve" x="393" y="502" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#7793A7" font-weight="400">8</text><text xml:space="preserve" x="425" y="502" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#294E62" font-weight="400">        double area = length * width;</text><text xml:space="preserve" x="393" y="531" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#7793A7" font-weight="400">9</text><text xml:space="preserve" x="425" y="531" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#294E62" font-weight="400">        System.out.printf(&quot;%.2f&quot;, area);</text><text xml:space="preserve" x="393" y="560" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#7793A7" font-weight="400">10</text><text xml:space="preserve" x="425" y="560" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#294E62" font-weight="400">    }</text><text xml:space="preserve" x="393" y="589" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#7793A7" font-weight="400">11</text><text xml:space="preserve" x="425" y="589" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#294E62" font-weight="400">}</text><rect x="374" y="708" width="675" height="222" rx="12" fill="white" stroke="#E2E8F0"/><rect x="375" y="709" width="673" height="35" rx="8" fill="#F2F5F8"/><text xml:space="preserve" x="393" y="732" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#607A8C" font-weight="400">● ● ●    Terminal / Code Execution</text><text xml:space="preserve" x="974" y="732" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#778697" font-weight="400">Clear</text><text xml:space="preserve" x="395" y="775" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#2563EB" font-weight="700">Input</text><rect x="393" y="788" width="636" height="38" rx="5" fill="#F3FAFF" stroke="#E2E8F0"/><text xml:space="preserve" x="407" y="812" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#305677" font-weight="400">5.5 3.2</text><text xml:space="preserve" x="395" y="853" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#778697" font-weight="700">Output</text><text xml:space="preserve" x="395" y="884" font-family="Liberation Sans, Arial, sans-serif" font-size="17" fill="#16A575" font-weight="700">17.60</text><text xml:space="preserve" x="395" y="910" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#16A575" font-weight="400">✓ Đã chạy thành công  •  42 ms</text><rect x="374" y="949" width="170" height="40" rx="7" fill="#EFF4FA" stroke="#E2E8F0"/><text xml:space="preserve" x="390" y="974" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill=